[globals]
[general]
[sipregistrations]

#include orgn-wait-common.conf

[out-to-exten]
exten => _X!,1,Wait(1)
	same => n,Dial(PJSIP/${EXTEN}@${A_NUM},,Tt)
	same => n,Hangup()

[incoming]
exten => _X!,1,NoOp()
    same => n,ExecIf($["${EXTEN}" == "${B_NUM}"]?Goto(b-incoming,${EXTEN},1))
    same => n,ExecIf($["${EXTEN}" == "${C_NUM}"]?Goto(c-incoming,${EXTEN},1))
    same => n,ExecIf($["${EXTEN}" == "74952293042"]?Goto(ext-incoming,${EXTEN},1))
	same => n,Hangup()

; B consults C (##) at once and hangs up 9 s after answering, while the forwarded call still rings.
[b-incoming]
exten => _X!,1,Wait(1)
    same => n,Answer()
    same => n,Set(TIMEOUT(absolute)=9)
    same => n,Wait(1)
    same => n,SendDTMF(##${C_NUM})
    same => n,Milliwatt()

; C's phone forwards by itself: Transfer() on an unanswered PJSIP channel answers 302 Moved Temporarily.
[c-incoming]
exten => _X!,1,Ringing()
    same => n,Wait(1)
    same => n,Transfer(PJSIP/sip:74952293042@127.0.0.1)
    same => n,Hangup()

; Rings 7 s: B leaves (9 s after answering) while it rings, then it talks to A until A hangs up.
[ext-incoming]
exten => _X!,1,Ringing()
    same => n,Wait(7)
    same => n,Answer()
    same => n,Milliwatt()
