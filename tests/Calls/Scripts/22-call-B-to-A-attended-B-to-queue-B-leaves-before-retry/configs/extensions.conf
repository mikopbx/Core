[globals]
[general]
[sipregistrations]

#include orgn-wait-common.conf

; B calls A, so B's channel starts the call (it is the master channel of its linkedid).
[out-to-exten]
exten => _X!,1,Wait(1)
	same => n,Set(GLOBAL(C_CALLS)=0)
	same => n,Set(GLOBAL(D_CALLS)=0)
	same => n,Dial(PJSIP/${A_NUM}@${B_NUM},,TtU(b-answered))
	same => n,Hangup()

; B consults the queue once A answers and hangs up (9 s after A's answer) in the pause before the
; retry round, as in test 21.
[b-answered]
exten => s,1,Set(TIMEOUT(absolute)=9)
    same => n,SayDigits(${B_NUM})
    same => n,Wait(2)
    same => n,SayDigits(${B_NUM})
    same => n,SendDTMF(##${QUEUE_NUM})
    same => n,Milliwatt()
    same => n,return

[incoming]
exten => _X!,1,NoOp()
    same => n,ExecIf($["${EXTEN}" == "${A_NUM}"]?Goto(a-incoming,${EXTEN},1))
    same => n,ExecIf($["${EXTEN}" == "${C_NUM}"]?Goto(c-incoming,${EXTEN},1))
    same => n,ExecIf($["${EXTEN}" == "${D_NUM}"]?Goto(d-incoming,${EXTEN},1))
	same => n,Hangup()

[a-incoming]
exten => _X!,1,Wait(1)
    same => n,Answer()
    same => n,Set(TIMEOUT(absolute)=20)
    same => n,Milliwatt()

[c-incoming]
exten => _X!,1,Set(GLOBAL(C_CALLS)=$[${C_CALLS} + 1])
    same => n,GotoIf($[${C_CALLS} == 1]?busy)
    same => n,Ringing()
    same => n,Wait(4)
    same => n,Answer()
    same => n,Set(TIMEOUT(absolute)=7)
    same => n,SayDigits(${EXTEN})
    same => n,Milliwatt()
    same => n(busy),Busy(2)

; D is busy in the first round and rings unanswered in the retry.
[d-incoming]
exten => _X!,1,Set(GLOBAL(D_CALLS)=$[${D_CALLS} + 1])
    same => n,GotoIf($[${D_CALLS} == 1]?busy)
    same => n,Ringing()
    same => n,Wait(20)
    same => n(busy),Wait(1)
    same => n,Busy(2)
