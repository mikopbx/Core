[globals]
[general]
[sipregistrations]

#include orgn-wait-common.conf

[out-to-exten]
exten => _X!,1,Wait(1)
	same => n,Dial(PJSIP/${EXTEN}@${A_NUM},,Tt)
	same => n,Hangup()

[incoming]
exten => _X!,1,NoOp()
    same => n,ExecIf($["${EXTEN}" == "${B_NUM}"]?Goto(b-incoming,${EXTEN},1))
    same => n,ExecIf($["${EXTEN}" == "${C_NUM}"]?Goto(c-incoming,${EXTEN},1))
    same => n,ExecIf($["${EXTEN}" == "${D_NUM}"]?Goto(d-incoming,${EXTEN},1))
	same => n,Hangup()

; B stays on the line long enough to be returned to A after the failed transfer (otherwise Asterisk
; recalls B, which repeats the transfer).
[b-incoming]
exten => _X!,1,Wait(1)
    same => n,Answer()
    same => n,Set(TIMEOUT(absolute)=16)
    same => n,SayDigits(${EXTEN})
    same => n,Wait(2)
    same => n,SayDigits(${EXTEN})
    same => n,SendDTMF(##${C_NUM})
    same => n,Milliwatt()

; C's phone forwards by itself: Transfer() on an unanswered PJSIP channel answers 302 Moved Temporarily.
[c-incoming]
exten => _X!,1,Ringing()
    same => n,Wait(1)
    same => n,Transfer(PJSIP/${D_NUM})
    same => n,Hangup()

; The forward target is busy.
[d-incoming]
exten => _X!,1,Wait(1)
    same => n,Busy(2)
