[globals]
[general]
[sipregistrations]

#include orgn-wait-common.conf

[out-to-exten]
exten => _X!,1,Wait(1)
	same => n,Set(GLOBAL(C_CALLS)=0)
	same => n,Set(GLOBAL(D_CALLS)=0)
	same => n,Dial(PJSIP/${EXTEN}@${A_NUM},,Tt)
	same => n,Hangup()

[incoming]
exten => _X!,1,NoOp()
    same => n,ExecIf($["${EXTEN}" == "${B_NUM}"]?Goto(b-incoming,${EXTEN},1))
    same => n,ExecIf($["${EXTEN}" == "${C_NUM}"]?Goto(c-incoming,${EXTEN},1))
    same => n,ExecIf($["${EXTEN}" == "${D_NUM}"]?Goto(d-incoming,${EXTEN},1))
	same => n,Hangup()

; B consults the queue and hangs up (11 s after answering) ~1.3 s into the retry round, while both
; agents ring: then no single leg can be billed at B's hangup (#1100).
[b-incoming]
exten => _X!,1,Wait(1)
    same => n,Answer()
    same => n,Set(TIMEOUT(absolute)=11)
    same => n,SayDigits(${EXTEN})
    same => n,Wait(2)
    same => n,SayDigits(${EXTEN})
    same => n,SendDTMF(##${QUEUE_NUM})
    same => n,Milliwatt()

; C is busy in the first round of the queue and answers its retry ~4 s in (after B has left).
[c-incoming]
exten => _X!,1,Set(GLOBAL(C_CALLS)=$[${C_CALLS} + 1])
    same => n,GotoIf($[${C_CALLS} == 1]?busy)
    same => n,Ringing()
    same => n,Wait(4)
    same => n,Answer()
    same => n,Set(TIMEOUT(absolute)=7)
    same => n,SayDigits(${EXTEN})
    same => n,Milliwatt()
    same => n(busy),Busy(2)

; D is busy in the first round and rings unanswered in the retry, so it still rings when B leaves.
[d-incoming]
exten => _X!,1,Set(GLOBAL(D_CALLS)=$[${D_CALLS} + 1])
    same => n,GotoIf($[${D_CALLS} == 1]?busy)
    same => n,Ringing()
    same => n,Wait(20)
    same => n(busy),Wait(1)
    same => n,Busy(2)
