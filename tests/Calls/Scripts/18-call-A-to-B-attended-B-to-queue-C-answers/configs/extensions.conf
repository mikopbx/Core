[globals]
[general]
[sipregistrations]

#include orgn-wait-common.conf

[out-to-exten]
exten => _X!,1,Wait(1)
	same => n,Dial(PJSIP/${EXTEN}@${A_NUM},,Tt)
	same => n,Hangup()

[incoming]
exten => _X!,1,NoOp()
    same => n,ExecIf($["${EXTEN}" == "${B_NUM}"]?Goto(b-incoming,${EXTEN},1))
    same => n,ExecIf($["${EXTEN}" == "${C_NUM}"]?Goto(c-incoming,${EXTEN},1))
    same => n,ExecIf($["${EXTEN}" == "${D_NUM}"]?Goto(d-incoming,${EXTEN},1))
	same => n,Hangup()

; B hangs up 12 s after answering, ~3 s into its conversation with C: long enough to cross a second
; boundary, as billsec is counted in whole seconds.
[b-incoming]
exten => _X!,1,Wait(1)
    same => n,Answer()
    same => n,Set(TIMEOUT(absolute)=12)
    same => n,SayDigits(${EXTEN})
    same => n,Wait(2)
    same => n,SayDigits(${EXTEN})
    same => n,SendDTMF(##${QUEUE_NUM})
    same => n,Milliwatt()

; C answers after D has rejected the call.
[c-incoming]
exten => _X!,1,Wait(2)
    same => n,Answer()
    same => n,Set(TIMEOUT(absolute)=7)
    same => n,SayDigits(${EXTEN})
    same => n,Milliwatt()

; D is an agent of the queue too: it rings in parallel and rejects the call (busy) before C answers.
[d-incoming]
exten => _X!,1,Ringing()
    same => n,Wait(1)
    same => n,Busy(2)
