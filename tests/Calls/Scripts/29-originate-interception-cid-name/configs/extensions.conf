[globals]
[general]
[sipregistrations]

[orgn-wait]
exten => _X!,1,Set(TIMEOUT(absolute)=25)
    same => n,Answer()
    same => n,Set(GLOBAL(A_NUM)=${A_NUM})
    same => n,Set(GLOBAL(B_NUM)=${B_NUM})
    same => n,Set(GLOBAL(C_NUM)=${C_NUM})
    same => n,Set(GLOBAL(D_NUM)=${D_NUM})
    same => n,Set(GLOBAL(SRC_NUM)=${EXTEN})
    same => n,Milliwatt()

[out-to-exten]
exten => _X!,1,Wait(1)
	same => n,Dial(PJSIP/${EXTEN}@${A_NUM},25,Tt)
	same => n,Hangup()

[incoming]
exten => _X!,1,NoOp()
    same => n,ExecIf($["${EXTEN}" == "${D_NUM}"]?Goto(b-incoming,${EXTEN},1))
    same => n,ExecIf($["${EXTEN}" == "${C_NUM}"]?Goto(c-incoming,${EXTEN},1))
    same => n,Wait(20)
	same => n,Hangup()

; D keeps ringing and never answers: the call stays interceptable, the way a customer call
; rings at an operator before someone takes it over from the CTI panel.
[b-incoming]
exten => _X!,1,Set(TIMEOUT(absolute)=25)
    same => n,Ringing()
    same => n,Milliwatt()

; C is the operator who intercepts: answers at once, so the interception leg is answered while
; the intercepted channel is still alive.
[c-incoming]
exten => _X!,1,Answer()
    same => n,Set(TIMEOUT(absolute)=12)
    same => n,Milliwatt()
