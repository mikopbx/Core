[globals]
[general]
[sipregistrations]

#include orgn-wait-common.conf

[out-to-exten]
exten => _X!,1,Wait(1)
	same => n,Dial(PJSIP/${EXTEN}@${A_NUM},,Tt)
	same => n,Hangup()

[incoming]
exten => _X!,1,NoOp()
    same => n,ExecIf($["${EXTEN}" == "${B_NUM}"]?Goto(b-incoming,${EXTEN},1))
    same => n,ExecIf($["${EXTEN}" == "${C_NUM}"]?Goto(c-incoming,${EXTEN},1))
	same => n,Hangup()

; B's phone forwards by itself: Transfer() on an unanswered PJSIP channel answers 302 Moved Temporarily.
[b-incoming]
exten => _X!,1,Ringing()
    same => n,Wait(1)
    same => n,Transfer(PJSIP/${C_NUM})
    same => n,Hangup()

[c-incoming]
exten => _X!,1,Wait(1)
    same => n,Answer()
    same => n,Set(TIMEOUT(absolute)=7)
    same => n,SayDigits(${EXTEN})
    same => n,Milliwatt()
