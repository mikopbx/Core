[globals]
[general]
[sipregistrations]

#include orgn-wait-common.conf

[out-to-exten]
exten => _X!,1,Wait(1)
	same => n,Dial(PJSIP/${EXTEN}@${A_NUM},,Tt)
	same => n,Hangup()

[incoming]
exten => _X!,1,NoOp()
    same => n,ExecIf($["${EXTEN}" == "${B_NUM}"]?Goto(b-incoming,${EXTEN},1))
    same => n,ExecIf($["${EXTEN}" == "${C_NUM}"]?Goto(c-incoming,${EXTEN},1))
    same => n,ExecIf($["${EXTEN}" == "${D_NUM}"]?Goto(d-incoming,${EXTEN},1))
	same => n,Hangup()

; B consults the queue, nobody answers, and B cancels the transfer (atxferabort *0) and stays on
; the line long enough to talk to A again.
[b-incoming]
exten => _X!,1,Wait(1)
    same => n,Answer()
    same => n,Set(TIMEOUT(absolute)=16)
    same => n,SayDigits(${EXTEN})
    same => n,Wait(2)
    same => n,SayDigits(${EXTEN})
    same => n,SendDTMF(##${QUEUE_NUM})
    same => n,Wait(4)
    same => n,SendDTMF(*0)
    same => n,Milliwatt()

[c-incoming]
exten => _X!,1,Ringing()
    same => n,Wait(30)
    same => n,Hangup()

; D is an agent of the queue too: it rings in parallel and never answers.
[d-incoming]
exten => _X!,1,Ringing()
    same => n,Wait(30)
    same => n,Hangup()
