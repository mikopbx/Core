[globals]
[general]

#include orgn-wait-common.conf

[out-to-exten]
; A picks up its own ringing originate leg, the destination is an external number
exten => 8,1,Dial(PJSIP/\*8${A_NUM}@${A_NUM},15,Tt)
    same => n,Hangup()

[incoming]
exten => _X!,1,NoOp()
    ; The first call is the originate leg to A, the second one is the destination
    same => n,ExecIf($["${A_NUM}x" == "x"]?Set(GLOBAL(A_NUM)=${EXTEN}))
    same => n,ExecIf($["${EXTEN}" == "${A_NUM}"]?Goto(a-incoming,${EXTEN},1))
    same => n,Goto(b-incoming,${EXTEN},1)

[a-incoming]
; A's phone rings and never answers: the call is taken with *8 pickup
exten => _X!,1,Ringing()
    same => n,Wait(30)
    same => n,Hangup()

[b-incoming]
exten => _X!,1,Ringing()
    same => n,Wait(3)
    same => n,Answer()
    same => n,Set(TIMEOUT(absolute)=8)
    same => n,Milliwatt()
