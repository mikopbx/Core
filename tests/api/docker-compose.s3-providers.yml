# Local S3-compatible storage stand used by tests/api/test_s3_storage_garage.py
# and tests/api/test_s3_storage_minio.py.
#
# Brings up two single-node services on the host network so the MikoPBX
# php container (mikopbx-php83) can reach them by hostname or by host IP.
#
# Usage:
#   cd tests/api
#   docker compose -f docker-compose.s3-providers.yml up -d
#   ./bootstrap-s3-providers.sh    # creates buckets + access keys
#   pytest test_s3_storage_garage.py test_s3_storage_minio.py
#   docker compose -f docker-compose.s3-providers.yml down -v
#
# The stand is intentionally throwaway: no production config, default
# admin tokens, sqlite metadata. Do not expose these ports outside the
# developer machine.

name: mikopbx-s3-test-stand

services:
  garage:
    # Single-node Garage: S3 API on 3900, admin RPC on 3902.
    # GARAGE_RPC_SECRET and GARAGE_ADMIN_TOKEN come from .env.s3-test,
    # generated by bootstrap-s3-providers.sh on first run (gitignored).
    image: dxflrs/garage:v1.0.1
    container_name: mikopbx-test-garage
    restart: unless-stopped
    # .env.s3-test is generated by bootstrap-s3-providers.sh on first run.
    # required: false lets `docker compose up` succeed before the bootstrap
    # so the documented "compose up; bootstrap" order keeps working.
    env_file:
      - path: .env.s3-test
        required: false
    ports:
      - "3900:3900"   # S3 API
      - "3902:3902"   # Admin RPC
    volumes:
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
      - ./garage.toml:/etc/garage.toml:ro
    networks:
      - mikopbx-test-storage
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 3s
      retries: 12

  minio:
    # Single-node MinIO: S3 API on 9100 (host-side), web console on 9101.
    # Ports are intentionally non-default to avoid clashing with any
    # MinIO already running on the developer machine.
    image: quay.io/minio/minio:latest
    container_name: mikopbx-test-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - minio_data:/data
    networks:
      - mikopbx-test-storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 3s
      retries: 12

volumes:
  garage_meta:
  garage_data:
  minio_data:

networks:
  mikopbx-test-storage:
    name: mikopbx-test-storage
    # Bridged with default settings — the MikoPBX test container can join
    # this network at runtime via `docker network connect mikopbx-test-storage
    # mikopbx-php83`.
