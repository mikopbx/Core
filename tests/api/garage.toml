# Garage configuration for the MikoPBX S3-provider test stand.
# Single-node, sqlite metadata, replication factor 1.
# Region must match what the test (and the Garage preset) sends.
#
# Cluster RPC and admin tokens are NOT defined here. They are read from
# environment variables (GARAGE_RPC_SECRET, GARAGE_ADMIN_TOKEN) injected
# by docker-compose from tests/api/.env.s3-test, which is generated by
# bootstrap-s3-providers.sh on first run and gitignored.

metadata_dir = "/var/lib/garage/meta"
data_dir     = "/var/lib/garage/data"
db_engine    = "sqlite"

replication_factor = 1
rpc_bind_addr      = "[::]:3901"

[s3_api]
s3_region     = "garage"
api_bind_addr = "[::]:3900"
root_domain   = ".s3.garage"

[admin]
api_bind_addr = "[::]:3902"
