[www]
user = www
group = www

listen = /var/run/php-fpm.sock
listen.owner = www
listen.group = www
listen.mode = 0660

security.limit_extensions = .php

pm = dynamic
pm.max_children = 20
pm.start_servers = 3
pm.min_spare_servers = 1
pm.max_spare_servers = 6
pm.max_requests = 200

; #1233: errors go to syslog only; on screen they reach HTTP clients with paths and status 200.
; CLI keeps display_errors from php.d/50-mikopbx.ini.
php_admin_flag[display_errors] = off
