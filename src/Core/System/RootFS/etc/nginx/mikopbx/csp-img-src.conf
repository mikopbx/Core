# CSP img-src per-URL override.
# Marketplace pages need to load module logos and screenshots from the MikoPBX
# release CDN (CloudFront). Other admin pages stay strict ('self' + data + blob).
# Defined at http context; referenced from mikopbx/security-headers.conf.
map $request_uri $csp_img_src {
    default                                  "'self' data: blob:";
    "~^/admin-cabinet/pbx-extension-modules(/|$)" "'self' data: blob: https://*.cloudfront.net https://releases.mikopbx.com";
}
