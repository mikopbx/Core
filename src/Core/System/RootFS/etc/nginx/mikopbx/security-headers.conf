# Security headers (VULN-012)
# Included at server level AND in every location that has its own add_header
# (nginx does not inherit server-level add_header when location defines any)
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src $csp_img_src; font-src 'self' data:; media-src 'self' blob:; connect-src 'self' wss: ws: https://sentry.miko.ru; frame-ancestors 'self';" always;
