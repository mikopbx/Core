location = /favicon.ico {
    alias /usr/www/sites/admin-cabinet/favicon.ico;
    access_log off;
    expires 30d;
}
location ~ /\. {
    deny all;
}
location ~ ^/~  {
    deny all;
}
location ~* ^.+\.(jpg|jpeg|gif|png|svg|ico|css|js|map|woff|woff2|ttf|eot|webmanifest)$ {
    access_log off;
    expires 3d;
}