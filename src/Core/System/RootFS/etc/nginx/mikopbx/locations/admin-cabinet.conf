 		root /usr/www/sites;
        index /admin-cabinet/index.php;
        try_files $uri $uri/ @rewrite;

 		location @rewrite {
	    	rewrite ^/admin-cabinet/(.*)$ /admin-cabinet/index.php?_url=/$1;
		}
	    location ~ \.php$ {
	        try_files $uri =404;
	        # #1171: REST bodies land here after the /pbxcore/ rewrite. Upload chunks are 10 MiB; 32m leaves room
	        # for older module builds (up to 20 MiB). Module servers and locations keep the http-level 100G.
	        client_max_body_size 32m;
	        error_page 413 @body_too_large;
	        fastcgi_pass  unix:/var/run/php-fpm.sock;
	        fastcgi_index /index.php;

	        include fastcgi_params;
	        fastcgi_split_path_info       ^(.+\.php)(/.+)$;
	        fastcgi_param PATH_INFO       $fastcgi_path_info;
	        fastcgi_param PATH_TRANSLATED $document_root$fastcgi_path_info;
	        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
	    }
	    # Same JSON as the REST errors (#1171); `return` ends the request before the WAF access phase.
	    location @body_too_large {
	        default_type application/json;
	        return 413 '{"result":false,"data":[],"messages":{"error":["Request body too large"]}}';
	    }
	    location /favicon.ico {
        		try_files /admin-cabinet/favicon.ico /favicon.ico;
        }
        location /robots.txt {
        		try_files /admin-cabinet/robots.txt /robots.txt;
        }