location ^~ /avatars/ {
    alias /storage/usbdisk1/mikopbx/media/avatars/;
    access_log off;
    log_not_found off;
    expires 7d;
    # SECURITY (GHSA-x63j-p73m-9prg): avatars are user-writable content served same-origin.
    # Force no-sniff and strip any active content type so a file that slips in as HTML/SVG
    # cannot execute in the admin's browser (security-headers.conf sets nosniff + CSP).
    include mikopbx/security-headers.conf;
    error_page 404 = /admin-cabinet/assets/img/unknownPerson.jpg;
}
