location /pbxcore/ {
    # GHSA-343m-2899-5qh3: reject client-supplied _url at the edge; the route is
    # injected by the rewrite below. Other API query params are untouched.
    if ($arg__url) {
        return 400;
    }
    rewrite ^/pbxcore/(.*)$ /pbxcore/index.php?_url=/$1;
    try_files $uri $uri/index.php;
}
location /pbxcore/api/system/ping {
    add_header Cache-Control "no-store";
    include mikopbx/security-headers.conf;
    try_files /pbxcore/pong /ping;
}
location /pbxcore/files/ {
    open_file_cache off;
    types { }
    default_type application/octet-stream;
    add_header Content-Disposition "attachment";
    include mikopbx/security-headers.conf;
}